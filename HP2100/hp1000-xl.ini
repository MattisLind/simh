; Run from the repository root; see docs/README.md for preparing the user disk.
set on
on error exit 1
set console DBGINT=34
set cpu 1000-L,256K
set ASI enabled
set ASI LOCALACK
set ASI LOCALSTATUS
set HPI enabled
set HPI HARDDISK
set DA enabled
set DA0 7920
attach DA0 build/hp1000/rte-xl-native-user/disc.disc
set cpu LROM=build/hp1000/rte-xl-7920/rom.bin
deposit S 400
reset -p
on error ignore
step 50000000
on error exit 1
assert LSTATUS=207
send after=10000,delay=10000,"\045BDC27BOOT\r"
go
